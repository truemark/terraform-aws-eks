apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-capabilities
  annotations:
    policies.kyverno.io/title: Disallow Capabilities
    policies.kyverno.io/category: CIS Benchmark 5.2.9
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adding capabilities beyond those listed in the policy should be disallowed.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-capabilities
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
      validate:
        message: "Only the capabilities NET_BIND_SERVICE, AUDIT_WRITE are allowed."
        deny:
          conditions:
            - key: "{{ request.object.spec.containers[].securityContext.capabilities.add[] || 'NET_BIND_SERVICE' }}"
              operator: NotIn
              value: ["NET_BIND_SERVICE", "AUDIT_WRITE"]